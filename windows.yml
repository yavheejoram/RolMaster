name: Compilar RolMaster Windows 1.0
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verificar proyecto
        shell: pwsh
        run: |
          if (!(Test-Path 'RolMaster.csproj')) { throw 'El proyecto debe estar en la raíz del repositorio.' }
          dotnet --info
      - name: Restaurar dependencias
        run: dotnet restore RolMaster.csproj -r win-x64
      - name: Compilar
        run: dotnet build RolMaster.csproj -c Release -r win-x64 --no-restore
      - name: Publicar Windows autónomo
        run: dotnet publish RolMaster.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish
      - name: Verificar ejecutable
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/RolMaster.exe')) { throw 'No se ha generado RolMaster.exe' }
          Get-ChildItem publish | Select-Object Name,Length
      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: RolMaster-Windows-1.0-win-x64
          path: publish/
          if-no-files-found: error
